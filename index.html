<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram 업로드 테스트기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="page-header">
    <h1>Instagram 업로드 테스트기</h1>
    <p>이미지를 업로드하면 실제 피드에 올라간 것처럼 미리 볼 수 있어요. 실제로 게시되지 않습니다.</p>
  </header>

  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
    <div class="upload-inner">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="4"/>
        <circle cx="8.5" cy="9.5" r="1.5"/>
        <path d="M21 15l-5-5-9 9"/>
      </svg>
      <p>이미지를 드래그하거나 클릭해서 업로드</p>
      <span>여러 장을 선택하면 캐러셀로 표시됩니다 · 4:5 비율 권장</span>
    </div>
  </div>

  <div class="post-card" id="postCard" hidden>
    <div class="post-header">
      <div class="avatar"></div>
      <div class="user-info">
        <span class="username">your_username</span>
        <span class="location">Seoul, Korea</span>
      </div>
      <button class="icon-btn menu-btn" type="button" aria-label="더보기">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <circle cx="5" cy="12" r="1.8"/>
          <circle cx="12" cy="12" r="1.8"/>
          <circle cx="19" cy="12" r="1.8"/>
        </svg>
      </button>
    </div>

    <div class="media" id="media">
      <div class="carousel" id="carousel">
        <div class="carousel-track" id="carouselTrack"></div>
      </div>
      <button class="carousel-arrow prev" id="prevBtn" type="button" aria-label="이전 이미지">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="carousel-arrow next" id="nextBtn" type="button" aria-label="다음 이미지">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="carousel-counter" id="carouselCounter"></div>
      <div class="carousel-dots" id="carouselDots"></div>
    </div>

    <div class="actions">
      <div class="actions-left">
        <button class="icon-btn" type="button" aria-label="좋아요">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 21s-7.5-4.6-10-9.1C.4 8.2 2 4.5 5.6 4c2.1-.3 4 .8 6.4 3.2C14.4 4.8 16.3 3.7 18.4 4c3.6.5 5.2 4.2 3.6 7.9C19.5 16.4 12 21 12 21z"/>
          </svg>
        </button>
        <button class="icon-btn" type="button" aria-label="댓글">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M21 11.5a8.4 8.4 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.4 8.4 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
          </svg>
        </button>
        <button class="icon-btn" type="button" aria-label="공유">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
      <button class="icon-btn" type="button" aria-label="저장">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
        </svg>
      </button>
    </div>

    <div class="likes">좋아요 1,284개</div>
    <div class="caption"><span class="username">your_username</span> 오늘의 피드 미리보기 ✨ 실제 업로드 전에 느낌을 확인해보세요.</div>
    <div class="comments-link">댓글 32개 모두 보기</div>
    <div class="timestamp">2시간 전</div>

    <button class="reset-btn" id="resetBtn" type="button">다른 이미지로 바꾸기</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
